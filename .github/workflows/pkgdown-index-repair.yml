name: Repair pkgdown article index

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/pkgdown-index-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Register SCR responsivity article
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("_pkgdown.yml")
          text = path.read_text(encoding="utf-8")
          item = "  - scr-responsivity-sensitivity\n"
          marker = "  - sensitivity-and-recovery\n"

          if item not in text:
              if marker not in text:
                  raise SystemExit("Expected pkgdown article marker not found")
              text = text.replace(marker, marker + item, 1)
              path.write_text(text, encoding="utf-8")
          PY
      - name: Commit article index repair
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add _pkgdown.yml
          if ! git diff --cached --quiet; then
            git commit -m "docs: register SCR responsivity article in pkgdown"
            git push
          fi
