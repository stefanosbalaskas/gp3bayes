name: Measurement docs sync
on:
  push:
    branches: [master]
    paths:
      - 'R/scr-responsivity.R'
      - '.github/workflows/measurement-docs-sync.yml'
permissions:
  contents: write
jobs:
  roxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install system dependency for fs
        run: |
          sudo apt-get update
          sudo apt-get install -y libuv1-dev
      - name: Install roxygen2
        run: Rscript -e 'install.packages("roxygen2", repos="https://cloud.r-project.org")'
      - name: Regenerate exports and Rd files
        run: Rscript -e 'roxygen2::roxygenise()'
      - name: Commit generated exports and Rd
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NAMESPACE man
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerate SCR responsivity reference"
            git push
          fi
