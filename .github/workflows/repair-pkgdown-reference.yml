name: Repair pkgdown reference index

on:
  push:
    paths:
      - '.github/workflows/repair-pkgdown-reference.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Register SCR responsivity reference topic
        shell: python
        run: |
          from pathlib import Path
          path = Path('_pkgdown.yml')
          text = path.read_text(encoding='utf-8')
          topic = 'estimate_scr_responsivity_bayes'
          if topic in text:
              print(f'{topic} already registered; no change required.')
          else:
              needle = '  - validate_pupil_leave_future_out\narticles:\n'
              if needle not in text:
                  raise SystemExit('Expected end-of-reference anchor not found; refusing to edit.')
              replacement = (
                  '  - validate_pupil_leave_future_out\n'
                  '- title: SCR responsivity sensitivity\n'
                  '  contents:\n'
                  '  - estimate_scr_responsivity_bayes\n'
                  'articles:\n'
              )
              path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
      - name: Commit repair
        run: |
          if git diff --quiet -- _pkgdown.yml; then
            echo 'No repair needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add _pkgdown.yml
          git commit -m 'docs: register SCR responsivity reference topic'
          git push
