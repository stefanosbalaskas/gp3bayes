# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release', force_suggests: 'true',  extra_packages: 'any::rcmdcheck, any::BH, any::RcppEigen, any::StanHeaders'}
          - {os: windows-latest, r: 'release', force_suggests: 'true',  extra_packages: 'any::rcmdcheck, any::BH, any::RcppEigen, any::StanHeaders'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release', force_suggests: 'false', extra_packages: 'any::rcmdcheck, brms=?ignore, rstan=?ignore, cmdstanr=?ignore, SBC=?ignore, priorsense=?ignore'}
          - {os: ubuntu-latest,   r: 'release', force_suggests: 'true',  extra_packages: 'any::rcmdcheck, any::BH, any::RcppEigen, any::StanHeaders'}
          - {os: ubuntu-latest,   r: 'oldrel-1', force_suggests: 'false', extra_packages: 'any::rcmdcheck, brms=?ignore, rstan=?ignore'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          extra-repositories: |
            https://stan-dev.r-universe.dev
            https://r-multiverse.r-universe.dev

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: ${{ matrix.config.extra_packages }}
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        env:
          _R_CHECK_FORCE_SUGGESTS_: ${{ matrix.config.force_suggests }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
